name: IndexNow

# Ручной запуск: отправляет в IndexNow все страницы из sitemap.xml.
# Автоматическая отправка изменённых статей идёт из deploy-selectel.yml после каждой выкладки.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping IndexNow
        run: node scripts/indexnow.mjs --all
