name: SEO audit

on:
  schedule:
    # Понедельник 06:00 UTC = 09:00 по Москве
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SEO audit
        run: node scripts/seo-audit.mjs
