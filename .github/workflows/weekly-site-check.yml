name: Weekly site check

on:
  schedule:
    # Понедельник, МСК 09:17 / 10:17 / 11:17 / 13:17 / 16:17, затем запасные попытки во вторник и среду.
    # GitHub выполняет расписания «по возможности»: запуск может прийти с опозданием на часы или
    # потеряться совсем (19.10.2026 все понедельничные пропали). Поэтому попыток много, а шаг guard
    # пропускает остальные, если отчёт за последние 5 дней уже опубликован.
    - cron: "17 6 * * 1"
    - cron: "17 7 * * 1"
    - cron: "17 8 * * 1"
    - cron: "17 10 * * 1"
    - cron: "17 13 * * 1"
    - cron: "17 6 * * 2"
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Guard (пропустить, если отчёт за последние 5 дней уже есть)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = schedule ]; then
            issue=$(gh issue list --label weekly-report --state open --json number --jq '.[0].number')
            recent=0
            if [ -n "$issue" ]; then
              recent=$(gh issue view "$issue" --json comments --jq '[.comments[] | select(.body | contains("отчёт за")) | select(.createdAt > (now - 432000 | todate))] | length')
            fi
            if [ "$recent" -gt 0 ]; then
              skip=true
              echo "Отчёт за последние 5 дней уже опубликован, пропускаю."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install PDF reader
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 -m pip install --quiet --break-system-packages pymupdf
          python3 -c "import fitz; print('PyMuPDF', fitz.__doc__.splitlines()[0])"

      - name: SEO audit
        id: seo
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/seo-audit.mjs | tee seo.md; exit ${PIPESTATUS[0]}

      - name: PageSpeed
        id: speed
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          if [ -z "$PAGESPEED_API_KEY" ]; then
            printf '# Скорость\n\nНе проверена: в секретах репозитория нет PAGESPEED_API_KEY.\n' | tee speed.md
            exit 1
          fi
          node scripts/pagespeed.mjs | tee speed.md; exit ${PIPESTATUS[0]}

      - name: Post weekly report
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEO: ${{ steps.seo.outcome }}
          SPEED: ${{ steps.speed.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          date=$(TZ=Europe/Moscow date +%d.%m.%Y)
          if [ "$SEO" = success ] && [ "$SPEED" = success ]; then
            status="✅ всё в порядке"
          else
            status="⚠️ есть проблемы"
          fi
          line() { [ "$1" = success ] && echo "✅ $2: в порядке" || echo "⚠️ $2: есть проблемы, подробности ниже"; }
          {
            echo "@${{ github.repository_owner }} отчёт за $date: **$status**"
            echo
            line "$SEO" "SEO (ссылки, title, description, картинки)"
            line "$SPEED" "Скорость загрузки"
            echo
            cat seo.md
            echo
            cat speed.md
            echo
            echo "[Запуск на GitHub]($RUN_URL)"
          } > report.md

          title="Еженедельный отчёт сайта: $status ($date)"
          gh label create weekly-report --color 0e8a16 --description "Еженедельный отчёт сайта" 2>/dev/null || true
          issue=$(gh issue list --label weekly-report --state open --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            gh issue create --title "$title" --label weekly-report --body-file report.md
          else
            gh issue edit "$issue" --title "$title"
            gh issue comment "$issue" --body-file report.md
          fi

      - name: Send Telegram message
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_SDKV }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID_SDKV }}
          SEO: ${{ steps.seo.outcome }}
          SPEED: ${{ steps.speed.outcome }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Телеграм не настроен (нет TELEGRAM_BOT_TOKEN_SDKV / TELEGRAM_CHAT_ID_SDKV), пропускаю."
            exit 0
          fi
          date=$(TZ=Europe/Moscow date +%d.%m.%Y)
          url=$(gh issue list --label weekly-report --state open --json url --jq '.[0].url')
          if [ "$SEO" = success ] && [ "$SPEED" = success ]; then head="✅ Отчёт сайта за $date: всё в порядке"; else head="⚠️ Отчёт сайта за $date: есть проблемы"; fi
          {
            echo "$head"
            echo
            [ "$SEO" = success ] && echo "✅ SEO: в порядке" || echo "⚠️ SEO: есть проблемы"
            [ "$SPEED" = success ] && echo "✅ Скорость: в порядке" || echo "⚠️ Скорость: есть проблемы"
            grep -h '^- ' seo.md speed.md || true
            echo
            echo "Подробности: $url"
          } > tg.txt
          head -c 3800 tg.txt > tg-short.txt
          curl -sS --fail-with-body "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text@tg-short.txt" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
          echo "Сообщение в Телеграм отправлено."
